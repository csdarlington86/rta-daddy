/* Draws the Instagram kit and POSTs each PNG to /save?name=<file>.
   Feed: 1080x1080 · Stories: 1080x1920 (key content kept inside y=250..1560). */

const FONT = '"Segoe UI", Helvetica, Arial, sans-serif';
const MONO = 'ui-monospace, "SF Mono", Menlo, Consolas, monospace';
const GREEN = '#12b312', BRIGHT = '#00e676', LIGHT = '#5aeb5a';
const INK = '#eafff2', MUTED = '#8fa39a', FAINT = '#6f8a7c';

const c = document.getElementById('c');
const out = document.getElementById('out');
let g, W, H;

/* ---------- primitives ---------- */
function rr(x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

function bg(glowY) {
  const lin = g.createLinearGradient(0, 0, W, H);
  lin.addColorStop(0, '#0b1210');
  lin.addColorStop(1, '#05070a');
  g.fillStyle = lin;
  g.fillRect(0, 0, W, H);

  const gy = glowY == null ? H * 0.34 : glowY;
  const glow = g.createRadialGradient(W / 2, gy, 30, W / 2, gy, Math.max(W, H) * 0.72);
  glow.addColorStop(0, 'rgba(0,230,118,0.17)');
  glow.addColorStop(1, 'rgba(0,230,118,0)');
  g.fillStyle = glow;
  g.fillRect(0, 0, W, H);

  g.strokeStyle = 'rgba(255,255,255,0.042)';
  g.lineWidth = 1;
  const step = W > 1100 ? 90 : 60;
  for (let x = 0; x <= W; x += step) { g.beginPath(); g.moveTo(x + 0.5, 0); g.lineTo(x + 0.5, H); g.stroke(); }
  for (let y = 0; y <= H; y += step) { g.beginPath(); g.moveTo(0, y + 0.5); g.lineTo(W, y + 0.5); g.stroke(); }
}

function icon(x, y, size) {
  const r = size * 0.2;
  g.save();
  rr(x, y, size, size, r);
  g.fillStyle = '#08080a';
  g.fill();
  g.strokeStyle = 'rgba(0,230,118,0.38)';
  g.lineWidth = Math.max(2, size * 0.011);
  g.stroke();

  const n = 11, pad = size * 0.14, gap = size * 0.021;
  const bw = (size - pad * 2 - gap * (n - 1)) / n;
  const base = y + size - pad, peak = size - pad * 2;
  const frac = [0.26, 0.44, 0.63, 0.83, 0.93, 0.75, 0.59, 0.43, 0.31, 0.22, 0.16];
  for (let i = 0; i < n; i++) {
    const h = peak * frac[i];
    const bx = x + pad + i * (bw + gap);
    g.fillStyle = GREEN;
    g.fillRect(bx, base - h, bw, h);
    g.fillStyle = LIGHT;
    g.fillRect(bx, base - h, bw, Math.max(2, size * 0.012));
  }
  g.restore();
}

function wordmark(x, baseline, rtaPx, daddyPx) {
  g.textBaseline = 'alphabetic';
  g.fillStyle = '#ffffff';
  g.font = '300 ' + rtaPx + 'px ' + FONT;
  g.fillText('RTA', x, baseline);
  const w = g.measureText('RTA').width;
  g.fillStyle = BRIGHT;
  g.font = '600 ' + daddyPx + 'px ' + FONT;
  g.fillText('DADDY', x + w + rtaPx * 0.15, baseline - rtaPx * 0.035);
  return w + rtaPx * 0.15 + g.measureText('DADDY').width;
}

function wordmarkWidth(rtaPx, daddyPx) {
  g.font = '300 ' + rtaPx + 'px ' + FONT;
  const a = g.measureText('RTA').width;
  g.font = '600 ' + daddyPx + 'px ' + FONT;
  return a + rtaPx * 0.15 + g.measureText('DADDY').width;
}

function pill(label, x, y, size, h, opts) {
  const o = opts || {};
  g.font = (o.weight || 600) + ' ' + size + 'px ' + (o.mono ? MONO : FONT);
  const padX = size * 0.95;
  const w = g.measureText(label).width + padX * 2;
  rr(x, y, w, h, h / 2);
  g.fillStyle = o.solid ? 'rgba(0,230,118,0.16)' : 'rgba(0,230,118,0.09)';
  g.fill();
  g.strokeStyle = o.strong ? 'rgba(0,230,118,0.72)' : 'rgba(0,230,118,0.42)';
  g.lineWidth = Math.max(1.6, size * 0.055);
  g.stroke();
  g.fillStyle = o.color || '#b9f5ce';
  g.textBaseline = 'middle';
  g.fillText(label, x + padX, y + h / 2 + 1);
  g.textBaseline = 'alphabetic';
  return w;
}

function centerPills(labels, y, size, h, gapC, opts) {
  const widths = labels.map((l) => {
    g.font = '600 ' + size + 'px ' + FONT;
    return g.measureText(l).width + size * 0.95 * 2;
  });
  let total = widths.reduce((a, b) => a + b, 0) + gapC * (labels.length - 1);
  let x = (W - total) / 2;
  labels.forEach((l, i) => { pill(l, x, y, size, h, opts); x += widths[i] + gapC; });
  return total;
}

function center(text, y, font, color) {
  g.font = font;
  g.fillStyle = color;
  g.textAlign = 'center';
  g.fillText(text, W / 2, y);
  g.textAlign = 'left';
}

/* ---------- a spectrogram panel ---------- */
function heat(v) {
  const stops = [[0.05, [7, 14, 10]], [0.3, [18, 150, 30]], [0.62, [90, 235, 90]], [0.86, [200, 255, 214]], [1, [240, 255, 246]]];
  for (let i = 1; i < stops.length; i++) {
    if (v <= stops[i][0]) {
      const a = stops[i - 1], b = stops[i];
      const t = (v - a[0]) / (b[0] - a[0]);
      return 'rgb(' + a[1].map((n, k) => Math.round(n + (b[1][k] - n) * t)).join(',') + ')';
    }
  }
  return 'rgb(240,255,246)';
}

function specValue(fx, ty) {
  let v = 0.08 + 0.05 * Math.sin(fx * 9 + ty * 4);
  v += 0.58 * Math.exp(-Math.pow((fx - 0.42 + 0.05 * Math.sin(ty * 3)) / 0.14, 2)) * (0.6 + 0.4 * Math.sin(ty * 5));
  v += 0.36 * Math.exp(-Math.pow((fx - 0.68 - 0.04 * Math.sin(ty * 2.2)) / 0.085, 2)) * (0.5 + 0.5 * Math.cos(ty * 4.5));
  v += 0.2 * Math.exp(-Math.pow((fx - 0.2) / 0.19, 2)) * (0.4 + 0.6 * Math.sin(ty * 7));
  v += 0.55 * Math.pow(Math.max(0, Math.sin(ty * 11)), 6) * Math.exp(-Math.pow((fx - 0.55) / 0.3, 2));
  return Math.min(1, Math.max(0, v));
}

function waterfall(x, y, w, h) {
  const cell = Math.max(3, Math.round(w / 190));
  for (let py = 0; py < h; py += cell) {
    for (let px = 0; px < w; px += cell) {
      /* quantise time into slices so the plot reads as a waterfall rather than
         one soft blur */
      const t = 1 - py / h;
      const sl = Math.round(t * 120) / 120;
      const v = specValue(px / w, t * 0.55 + sl * 0.45);
      g.fillStyle = heat(v);
      g.fillRect(x + px, y + py, cell, cell);
    }
  }
  /* frame + frequency ticks */
  g.strokeStyle = 'rgba(255,255,255,0.16)';
  g.lineWidth = 2;
  g.strokeRect(x + 1, y + 1, w - 2, h - 2);
  const ticks = [[0.05, '50'], [0.2, '200'], [0.4, '1k'], [0.62, '4k'], [0.82, '10k']];
  g.font = '600 ' + Math.round(h * 0.032) + 'px ' + MONO;
  g.fillStyle = 'rgba(230,255,240,0.72)';
  g.textBaseline = 'top';
  for (const [fx, label] of ticks) {
    const tx = x + fx * w;
    g.strokeStyle = 'rgba(255,255,255,0.22)';
    g.lineWidth = 1;
    g.beginPath(); g.moveTo(tx, y); g.lineTo(tx, y + h); g.stroke();
    g.fillText(label, tx + 4, y + h + 6);
  }
  g.textBaseline = 'alphabetic';
}

function sliders(x, y, w, minV, maxV, size) {
  const knob = size * 0.58;
  const trackH = Math.max(4, size * 0.14);
  const trackX = x + size * 0.5;
  const trackW = w - size;
  const cy = y + knob;
  rr(trackX, cy - trackH / 2, trackW, trackH, trackH / 2);
  g.fillStyle = 'rgba(255,255,255,0.2)';
  g.fill();

  const baseY = cy + knob + size * 1.15;
  g.font = '600 ' + Math.round(size * 0.86) + 'px ' + MONO;
  /* end labels, then the value under each knob so nothing overlaps */
  g.fillStyle = FAINT;
  g.textBaseline = 'alphabetic';
  g.fillText('MIN', x, baseY);
  g.textAlign = 'right';
  g.fillText('MAX', x + w, baseY);
  g.textAlign = 'left';

  [[0.22, minV], [0.76, maxV]].forEach(([p, val]) => {
    const cx = trackX + trackW * p;
    g.beginPath();
    g.arc(cx, cy, knob, 0, Math.PI * 2);
    g.fillStyle = BRIGHT;
    g.fill();
    g.fillStyle = INK;
    g.textAlign = 'center';
    g.fillText(val, cx, baseY);
    g.textAlign = 'left';
  });
  return baseY - y;
}

/* Wi-Fi arcs inside a ring with a slash through it — the classic no-signal badge.
   d is the badge diameter: everything scales off it. */
function wifiOff(cx, cy, d) {
  const R = d / 2;
  g.save();
  g.lineCap = 'round';

  g.strokeStyle = 'rgba(170,190,180,0.40)';
  g.lineWidth = d * 0.050;
  g.beginPath();
  g.arc(cx, cy, R * 0.93, 0, Math.PI * 2);
  g.stroke();

  /* arcs and dot sit low, so the dot clears the bottom of the ring */
  const cyA = cy + R * 0.34;
  for (let i = 0; i < 3; i++) {
    const r = R * (0.34 + i * 0.23);
    g.beginPath();
    g.arc(cx, cyA, r, Math.PI * 1.21, Math.PI * 1.79);
    g.stroke();
  }
  g.fillStyle = 'rgba(170,190,180,0.48)';
  g.beginPath();
  g.arc(cx, cyA, d * 0.042, 0, Math.PI * 2);
  g.fill();

  /* diagonal slash: dark halo so it reads over the arcs, then the green bar */
  const k = R * 0.72;
  g.strokeStyle = '#05070a';
  g.lineWidth = d * 0.118;
  g.beginPath(); g.moveTo(cx - k, cy - k); g.lineTo(cx + k, cy + k); g.stroke();
  g.strokeStyle = BRIGHT;
  g.lineWidth = d * 0.054;
  g.beginPath(); g.moveTo(cx - k, cy - k); g.lineTo(cx + k, cy + k); g.stroke();

  g.restore();
}

/* A numbered step plate: badge, title, one-line detail. */
function stepRow(x, y, w, num, title, sub, accent) {
  const h = 132;
  rr(x, y, w, h, 22);
  g.fillStyle = accent ? 'rgba(0,230,118,0.13)' : 'rgba(255,255,255,0.045)';
  g.fill();
  g.strokeStyle = accent ? 'rgba(0,230,118,0.55)' : 'rgba(255,255,255,0.18)';
  g.lineWidth = 2;
  g.stroke();

  const d = 62, bx = x + 28, by = y + (h - d) / 2;
  g.beginPath();
  g.arc(bx + d / 2, by + d / 2, d / 2, 0, Math.PI * 2);
  g.fillStyle = accent ? BRIGHT : 'rgba(255,255,255,0.13)';
  g.fill();
  g.fillStyle = accent ? '#04140b' : INK;
  g.font = '700 34px ' + FONT;
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillText(String(num), bx + d / 2, by + d / 2 + 1);
  g.textAlign = 'left';
  g.textBaseline = 'alphabetic';

  g.fillStyle = INK;
  g.font = '600 33px ' + FONT;
  g.fillText(title, bx + d + 26, y + 58);
  g.fillStyle = MUTED;
  g.font = '400 26px ' + FONT;
  g.fillText(sub, bx + d + 26, y + 94);
  return h;
}

function wrapText(text, cx, y, maxW, lh) {
  const words = text.split(' ');
  let line = '', ly = y;
  for (const wd of words) {
    const test = line ? line + ' ' + wd : wd;
    if (g.measureText(test).width > maxW && line) {
      g.fillText(line, cx, ly);
      line = wd;
      ly += lh;
    } else line = test;
  }
  if (line) g.fillText(line, cx, ly);
  return ly;
}

/* ---------- run ---------- */
function loadImage(src) {
  return new Promise((res) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = () => res(null);
    img.src = src;
  });
}

(async () => {
  QR = await loadImage('../qr/rta-daddy-qr.png');
  out.textContent = 'qr: ' + (QR ? QR.naturalWidth + 'x' + QR.naturalHeight : 'MISSING') + '\n';
  const saved = [];
  for (const v of variants) {
    g = c.getContext('2d');
    c.width = v.w; c.height = v.h;
    W = v.w; H = v.h;
    g.textBaseline = 'alphabetic';
    g.textAlign = 'left';
    v.draw();
    const blob = await new Promise((res) => c.toBlob(res, 'image/png'));
    try {
      const r = await fetch('/save?name=' + v.file, { method: 'POST', body: blob });
      const j = await r.json();
      saved.push({ file: v.file, w: v.w, h: v.h, bytes: j.bytes });
      out.textContent += 'saved ' + v.file + '.png  ' + v.w + 'x' + v.h + '  ' + (j.bytes / 1024).toFixed(0) + ' KiB\n';
    } catch (e) {
      out.textContent += 'FAILED ' + v.file + ': ' + e.message + '\n';
      saved.push({ file: v.file, error: e.message });
    }
  }
  out.textContent += 'done: ' + saved.length + ' files';
  window.__adsDone = saved;
})();
</script>
